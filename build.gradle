plugins {
    id 'java'
}

apply from: 'project-properties.gradle'

// Where the ReportPortal classes this plugin compiles against live.
//
// Plugins normally take them from the published `com.epam.reportportal:plugin-api` artifact plus
// `commons-bom`. Neither works for this build: service-api's develop branch moved every domain
// class from com.epam.ta.reportportal to com.epam.reportportal.base and pulled the extension API
// in-tree, ahead of the published plugin-api (untouched since 2025-12). Compiling against the
// artifact produces a jar that loads and then dies with NoClassDefFoundError the moment PF4J
// instantiates the extension.
//
// So the classpath is the running service-api itself, unpacked from its image. See README-port.md
// for the four commands that produce it. Override with -PrpApiDir=... if you keep it elsewhere.
def rpApiDir = project.findProperty('rpApiDir') ?: '/tmp/rp-api-classes'

repositories {
    mavenCentral()
}

dependencies {
    // compileOnly throughout: every one of these is already on the host's classpath, and PF4J
    // gives the plugin the host's classloader for them. Bundling a second copy is how a plugin
    // ends up with two incompatible versions of the same class at runtime.
    compileOnly files("${rpApiDir}/service-api-classes.jar")
    compileOnly fileTree(dir: "${rpApiDir}/BOOT-INF/lib", include: ['*.jar'])

    // PF4J finds extensions through META-INF/extensions.idx, written by its annotation processor
    // at compile time. Without it the plugin loads, starts, and exposes nothing — the host asks
    // for its extension, gets none, and the install fails on an empty Optional rather than on
    // anything that names the cause. Pinned to the pf4j the host runs (3.15.0).
    annotationProcessor 'org.pf4j:pf4j:3.15.0' 
}

// service-api is compiled to class file 69 (Java 25), so the plugin must be too — javac refuses
// to read a newer class file than it targets. Gradle itself cannot run on 25 yet, so this forks
// the compiler out to a 25 toolchain and leaves the daemon where it is.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jar {
    manifest {
        attributes(
                "Plugin-Class": "${pluginClass}",
                "Plugin-Id": "${pluginId}",
                "Plugin-Name": "${pluginName}",
                "Plugin-Version": "${project.version}",
                "Plugin-Provider": "${provider}",
                "Plugin-License": "${license}",
                "Plugin-Description": "${project.description}",
                "Plugin-Metadata-isIntegrationsAllowed": "${isIntegrationsAllowed}",
                "Plugin-Metadata-embedded": "${isEmbedded}",
                "Plugin-Metadata-isMultiple": "${isMultiple}",
        )
    }
}
